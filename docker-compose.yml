version: "3.8"

services:
  site_a:
    image: mysql:8.0
    container_name: site_a
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: site_a_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - db_network

  site_b:
    image: mysql:8.0
    container_name: site_b
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: site_b_db
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - db_network

  app:
    build: .
    container_name: serverless_app
    depends_on:
      site_a:
        condition: service_healthy
      site_b:
        condition: service_healthy
    volumes:
      - ./output:/app/output
    networks:
      - db_network
    stdin_open: true
    tty: true
    restart: always

networks:
  db_network:
    driver: bridge